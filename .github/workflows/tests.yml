name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: workshops
          POSTGRES_USER: workshop
          POSTGRES_PASSWORD: workshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workshop -d workshops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://workshop:workshop@localhost:5432/workshops
      TEST_DATABASE_URL: postgresql+psycopg://workshop:workshop@localhost:5432/workshops
      NOTIFICATION_SERVICE_URL: http://localhost:8001
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run alembic upgrade head
      - run: uv run pytest
      - run: uv run ruff check .
